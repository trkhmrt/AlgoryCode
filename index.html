    <script type="text/babel">
      const { useEffect, useRef } = React;

      function FadingVideo({ src, className = "", style = {} }) {
        const videoRef = useRef(null);
        const rafRef = useRef(0);
        const fadeStateRef = useRef({
          running: false,
          startTime: 0,
          startOpacity: 0,
          targetOpacity: 0,
          duration: 500,
        });
        const fadingOutRef = useRef(false);

        const FADE_MS = 500;
        const FADE_OUT_LEAD = 0.55;

        const readOpacity = () => {
          const video = videoRef.current;
          if (!video) return 0;
          const raw = video.style.opacity;
          const parsed = parseFloat(raw);
          if (Number.isNaN(parsed)) return 0;
          return Math.max(0, Math.min(1, parsed));
        };

        const setOpacity = (value) => {
          const video = videoRef.current;
          if (!video) return;
          video.style.opacity = String(Math.max(0, Math.min(1, value)));
        };

        const cancelFade = () => {
          if (rafRef.current) {
            cancelAnimationFrame(rafRef.current);
            rafRef.current = 0;
          }
          fadeStateRef.current.running = false;
        };

        const fadeTo = (target, duration = FADE_MS) => {
          const video = videoRef.current;
          if (!video) return;

          cancelFade();

          const startOpacity = readOpacity();
          if (Math.abs(target - startOpacity) < 0.001 || duration <= 0) {
            setOpacity(target);
            return;
          }

          fadeStateRef.current = {
            running: true,
            startTime: performance.now(),
            startOpacity,
            targetOpacity: target,
            duration,
          };

          const tick = (now) => {
            const state = fadeStateRef.current;
            if (!state.running) return;

            const elapsed = now - state.startTime;
            const t = Math.max(0, Math.min(1, elapsed / state.duration));
            const next =
              state.startOpacity + (state.targetOpacity - state.startOpacity) * t;
            setOpacity(next);

            if (t < 1) {
              rafRef.current = requestAnimationFrame(tick);
            } else {
              state.running = false;
              rafRef.current = 0;
              setOpacity(state.targetOpacity);
            }
          };

          rafRef.current = requestAnimationFrame(tick);
        };

        useEffect(() => {
          const video = videoRef.current;
          if (!video) return undefined;

          const onLoadedData = () => {
            setOpacity(0);
            const p = video.play();
            if (p && typeof p.catch === "function") p.catch(() => {});
            fadeTo(1, FADE_MS);
          };

          const onTimeUpdate = () => {
            if (!video.duration || Number.isNaN(video.duration)) return;
            const remain = video.duration - video.currentTime;
            if (!fadingOutRef.current && remain <= FADE_OUT_LEAD && remain > 0) {
              fadingOutRef.current = true;
              fadeTo(0, FADE_MS);
            }
          };

          const onEnded = () => {
            setOpacity(0);
            setTimeout(() => {
              const node = videoRef.current;
              if (!node) return;
              node.currentTime = 0;
              const p = node.play();
              if (p && typeof p.catch === "function") p.catch(() => {});
              fadingOutRef.current = false;
              fadeTo(1, FADE_MS);
            }, 100);
          };

          video.style.opacity = "0";
          video.addEventListener("loadeddata", onLoadedData);
          video.addEventListener("timeupdate", onTimeUpdate);
          video.addEventListener("ended", onEnded);

          if (video.readyState >= 2) {
            onLoadedData();
          }

          return () => {
            cancelFade();
            video.removeEventListener("loadeddata", onLoadedData);
            video.removeEventListener("timeupdate", onTimeUpdate);
            video.removeEventListener("ended", onEnded);
          };
        }, [src]);

        return (
          <video
            ref={videoRef}
            src={src}
            className={className}
            style={{ ...style, opacity: 0 }}
            autoPlay
            muted
            playsInline
            preload="auto"
          />
        );
      }

      window.FadingVideo = FadingVideo;
    </script>

    <script type="text/babel">
      const { useEffect, useRef, useState } = React;
      const { motion } = window.Motion;

      function BlurText({ text, className = "" }) {
        const containerRef = useRef(null);
        const [visible, setVisible] = useState(false);
        const words = text.split(" ");

        useEffect(() => {
          const node = containerRef.current;
          if (!node) return undefined;

          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  setVisible(true);
                }
              });
            },
            { threshold: 0.1 }
          );

          observer.observe(node);
          return () => observer.disconnect();
        }, []);

        return (
          <p
            ref={containerRef}
            className={`${className} flex flex-wrap justify-center`}
            style={{ rowGap: "0.1em" }}
          >
            {words.map((word, i) => (
              <motion.span
                key={`${word}-${i}`}
                style={{ display: "inline-block", marginRight: "0.28em" }}
                initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
                animate={
                  visible
                    ? {
                        filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                        opacity: [0, 0.5, 1],
                        y: [50, -5, 0],
                      }
                    : { filter: "blur(10px)", opacity: 0, y: 50 }
                }
                transition={{
                  duration: 0.7,
                  times: [0, 0.5, 1],
                  ease: "easeOut",
                  delay: (i * 100) / 1000,
                }}
              >
                {word}
              </motion.span>
            ))}
          </p>
        );
      }

      window.BlurText = BlurText;
    </script>
